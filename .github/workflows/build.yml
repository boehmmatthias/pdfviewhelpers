name: build

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        env:
          - { TYPO3_VERSION: 13, PHP_VERSION: 8.2 }
          - { TYPO3_VERSION: 13, PHP_VERSION: 8.3 }
          - { TYPO3_VERSION: 14, PHP_VERSION: 8.4 }
          - { TYPO3_VERSION: 14, PHP_VERSION: 8.5 }

    env:
      # The example tests compare the generated PDFs byte by byte, which requires exact library versions
      PDF_LIBRARIES: >-
        tecnickcom/tc-lib-barcode:2.16.6
        tecnickcom/tc-lib-color:3.0.9
        tecnickcom/tc-lib-file:3.9.6
        tecnickcom/tc-lib-pdf:8.78.2
        tecnickcom/tc-lib-pdf-encrypt:2.11.6
        tecnickcom/tc-lib-pdf-filter:2.11.6
        tecnickcom/tc-lib-pdf-font:4.5.1
        tecnickcom/tc-lib-pdf-graph:2.18.4
        tecnickcom/tc-lib-pdf-image:3.14.6
        tecnickcom/tc-lib-pdf-page:4.16.7
        tecnickcom/tc-lib-pdf-parser:3.16.4
        tecnickcom/tc-lib-pdf-sign:2.0.7
        tecnickcom/tc-lib-unicode:3.1.0
        tecnickcom/tc-lib-unicode-data:3.0.11

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.env.PHP_VERSION }}
          tools: composer
          extensions: pdo, sqlite3

      - name: Update Composer
        run: |
          sudo composer self-update
          composer --version

      - name: Install QPDF
        run: |
          sudo apt-get update
          sudo apt-get install qpdf

      - name: Validate composer.json
        run: composer validate

      - name: Install TYPO3 core
        env: ${{ matrix.env }}
        run: composer require typo3/cms-core="^${TYPO3_VERSION}"

      - name: Install specific tc-lib-pdf versions for reproducible tests
        run: composer update -W $(printf -- '--with %s ' ${PDF_LIBRARIES})

      - name: PHPCS
        run: .Build/bin/phpcs -n --standard=PSR12 Classes/

      - name: Unit Tests
        run: .Build/bin/phpunit --testdox -c .Build/vendor/typo3/testing-framework/Resources/Core/Build/UnitTests.xml Tests/Unit/;

      - name: Start MySQL
        run: sudo /etc/init.d/mysql start

      - name: Functional Tests
        run: .Build/bin/phpunit -c ./Build/FunctionalTests.xml Tests/Functional/;
        env:
          typo3DatabaseName: typo3
          typo3DatabaseHost: 127.0.0.1
          typo3DatabaseUsername: root
          typo3DatabasePassword: root

      - name: Upload Test Outputs
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: examples-output-${{ matrix.env.TYPO3_VERSION }}-${{ matrix.env.PHP_VERSION }}
          path: Tests/Output
